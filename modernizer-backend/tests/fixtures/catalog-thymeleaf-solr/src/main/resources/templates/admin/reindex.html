<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Reindex</title></head>
<body>
<div layout:fragment="content">
  <h1>Search index</h1>
  <p th:if="${message}" th:text="${message}" class="flash">done</p>
  <form id="reindexForm" th:action="@{/admin/reindex}" method="post" onsubmit="return confirm('Rebuild the whole index?')">
    <button type="submit">Rebuild full index</button>
  </form>
</div>
</body>
</html>
