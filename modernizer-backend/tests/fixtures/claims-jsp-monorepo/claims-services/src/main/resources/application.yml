server:
  port: 8090
  servlet:
    context-path: /claims-api
spring:
  datasource:
    url: ${CLAIMS_DB_URL:jdbc:oracle:thin:@//localhost:1521/CLAIMSPDB}
    username: ${CLAIMS_DB_USER:claims}
    password: ${CLAIMS_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
