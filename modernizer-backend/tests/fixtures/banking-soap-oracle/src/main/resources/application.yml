server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/ORCLPDB1}
    username: ${DB_USER:bank_app}
    password: ${DB_PASSWORD:Welcome1}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: "*"
bank:
  statement:
    max-days: 90
logging:
  level:
    com.acme.bank: DEBUG
