description = "Approve the step waiting on you: /modernize:approve [ids...] (companions, stacks, analysis, plan, documents)"
prompt = """
The user approves the gate the Stella Modernizer run is waiting on. Their words: `{{args}}`

1. Call `mcp_modernizer_run_status` to see which step it waits on (`select-companions`, `select-stacks`,
   `analysis-review`, `plan-review` or `documents-review`).
2. Call `mcp_modernizer_confirm` with the matching gate: `companions`, `stacks`, `analysis`, `plan` or
   `documents`. For `companions` / `stacks`, `selection` is the ids the user named (an empty list if they
   chose none; if they named nothing, ask — never pick for them). For `stacks`, `documents` is what they asked
   for (default: brd, technical_spec, test_inventory).
3. If the gate was `plan`, say once that code changes start now. Then continue exactly as /modernize:next.
"""
